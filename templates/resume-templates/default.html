<!-- default: true -->
<!-- Career OS — Default Resume Template -->
<!-- Rendered to PDF via Puppeteer. Margins controlled by export-pdf.js. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Calibri', 'Segoe UI', Arial, sans-serif;
    font-size: 10.5pt;
    line-height: 1.45;
    color: #1a1a1a;
    background: white;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid #1e3a5f;
  }
  .name {
    font-size: 24pt;
    font-weight: 700;
    color: #1e3a5f;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }
  .title-line {
    font-size: 11pt;
    color: #444;
    font-weight: 400;
    margin-bottom: 6px;
  }
  .contact-line {
    font-size: 9pt;
    color: #555;
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .contact-line a { color: #1e3a5f; text-decoration: none; }
  .contact-line span::before { content: '·'; margin-right: 18px; color: #999; }
  .contact-line span:first-child::before { content: none; margin-right: 0; }

  /* ── Summary ── */
  .summary {
    font-size: 10pt;
    line-height: 1.55;
    color: #222;
    margin-bottom: 14px;
    padding: 8px 12px;
    background: #f7f9fc;
    border-left: 3px solid #1e3a5f;
    border-radius: 0 4px 4px 0;
  }

  /* ── Section ── */
  .section {
    margin-bottom: 14px;
    page-break-inside: avoid;
  }
  .section-title {
    font-size: 9.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #1e3a5f;
    border-bottom: 1.5px solid #1e3a5f;
    padding-bottom: 3px;
    margin-bottom: 8px;
  }

  /* ── Experience Entry ── */
  .entry {
    margin-bottom: 10px;
    page-break-inside: avoid;
  }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1px;
  }
  .company {
    font-weight: 700;
    font-size: 10.5pt;
    color: #111;
  }
  .date {
    font-size: 9pt;
    color: #666;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .role-location {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .role {
    font-style: italic;
    font-size: 10pt;
    color: #333;
    font-weight: 500;
  }
  .location {
    font-size: 9pt;
    color: #777;
  }

  /* ── Bullets ── */
  ul {
    padding-left: 14px;
    margin-top: 3px;
  }
  ul li {
    margin-bottom: 3px;
    font-size: 10pt;
    line-height: 1.42;
    color: #1a1a1a;
  }
  ul li::marker {
    color: #1e3a5f;
    font-size: 9pt;
  }

  /* ── Skills Grid ── */
  .skills-table {
    width: 100%;
    border-collapse: collapse;
  }
  .skills-table td {
    padding: 2px 0;
    font-size: 10pt;
    vertical-align: top;
  }
  .skill-label {
    font-weight: 600;
    color: #333;
    white-space: nowrap;
    padding-right: 12px;
    width: 130px;
  }
  .skill-values {
    color: #1a1a1a;
  }

  /* ── Education ── */
  .edu-entry {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .edu-left .institution { font-weight: 700; font-size: 10.5pt; }
  .edu-left .degree { font-size: 10pt; color: #444; font-style: italic; }
  .edu-right { text-align: right; font-size: 9pt; color: #666; white-space: nowrap; }

  /* ── Projects ── */
  .project-entry { margin-bottom: 8px; page-break-inside: avoid; }
  .project-header { display: flex; justify-content: space-between; align-items: baseline; }
  .project-name { font-weight: 700; font-size: 10.5pt; }
  .project-link { font-size: 9pt; color: #1e3a5f; }
  .project-tech { font-size: 9pt; color: #555; font-style: italic; margin-bottom: 3px; }

  /* ── Certifications ── */
  .cert-entry {
    display: flex;
    justify-content: space-between;
    font-size: 10pt;
    margin-bottom: 3px;
  }

  /* ── Page Breaks ── */
  h1, .section-title { page-break-after: avoid; }
  .entry, .project-entry, .edu-entry { page-break-inside: avoid; }
</style>
</head>
<body>
<div class="page">
  {{RESUME_CONTENT}}
</div>
</body>
</html>
