<!-- default: true -->
<!-- Career OS — Default Resume Template (single column, ATS-safe, split header) -->
<!-- Filled by scripts/render-resume.py. Margins are set by scripts/export-pdf.js. -->
<!-- {{DENSITY}} is one of: roomy | normal | compact | tight (picked automatically to fit the page target). -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ── Density knobs: the renderer switches the body class until the page target fits ── */
  body          { --li: 9.6pt; --li-gap: 2.4px; --li-lh: 1.36; --sec-gap: 6px;  --role-gap: 5px; --sum-lh: 1.42; }
  body.roomy    { --li: 9.8pt; --li-gap: 3.2px; --li-lh: 1.40; --sec-gap: 10px; --role-gap: 7px; --sum-lh: 1.48; }
  body.compact  { --li: 9.4pt; --li-gap: 2px;   --li-lh: 1.33; --sec-gap: 6px;  --role-gap: 4px; --sum-lh: 1.38; }
  body.tight    { --li: 9.2pt; --li-gap: 1.5px; --li-lh: 1.30; --sec-gap: 5px;  --role-gap: 3px; --sum-lh: 1.34; }

  body {
    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 10pt;
    line-height: 1.45;
    color: #1a1a1a;
    background: white;
  }
  a { color: #1e3a5f; text-decoration: none; }
  li a { color: inherit; text-decoration: underline dotted; text-decoration-color: #7a8aa3; text-decoration-thickness: 0.7pt; text-underline-offset: 2px; }   /* a link inside a bullet: body-coloured text, thin dotted underline */
  .nb { white-space: nowrap; }   /* number compounds such as "41-tool" never break at the hyphen */

  /* ── Header: identity on the left, links stacked on the right.
        The left block comes first in the DOM so an ATS reads name → contact → links. ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 2px solid #1e3a5f;
  }
  .header .id { flex-shrink: 0; }
  .name { font-size: 20pt; font-weight: 700; color: #1e3a5f; letter-spacing: 0.5px; margin-bottom: 1px; }
  .headline { font-size: 10.5pt; color: #444; margin-bottom: 3px; }
  .contact { font-size: 8.2pt; color: #555; white-space: nowrap; }
  .contact .sep { color: #aaa; margin: 0 2px; }
  .links { text-align: right; font-size: 8.2pt; line-height: 1.5; }
  .links a.plink { color: #2d3748; -webkit-text-stroke: 0.25px #2d3748; }   /* header links: a touch more weight than body text, not bold */
  .links div:last-child { border-left: 1px solid #b4bcc8; padding-left: 7px; }   /* small divider on the last row only, between the email and the last link */
  .header.centered { display: block; text-align: center; }
  .header.centered .links { text-align: center; margin-top: 2px; }
  .header.centered .links div:last-child { border-left: 0; padding-left: 0; }
  .header.centered .links div { display: inline; margin: 0 7px; }

  /* Small, quiet icons in front of visible URLs. Decorative only: the URL text is what an ATS reads. */
  .ic { width: 8px; height: 8px; vertical-align: -0.5px; margin-right: 3px; color: #a0aab6; }
  a.plink { color: #4a5568; white-space: nowrap; }

  /* ── Summary ── */
  .summary {
    font-size: var(--li);
    line-height: var(--sum-lh);
    color: #222;
    margin-bottom: 10px;
    padding: 6px 10px;
    background: #f7f9fc;
    border-left: 3px solid #1e3a5f;
    border-radius: 0 4px 4px 0;
  }

  /* ── Sections ── */
  .section { margin-bottom: var(--sec-gap); }
  .section-title {
    font-size: 9.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #1e3a5f;
    border-bottom: 1.5px solid #1e3a5f;
    padding-bottom: 3px;
    margin-bottom: 6px;
    page-break-after: avoid;
  }

  /* ── Rows: label on the left, detail on the right ── */
  .row { display: flex; justify-content: space-between; align-items: baseline; page-break-after: avoid; }
  .row .right { font-size: 9pt; color: #666; white-space: nowrap; flex-shrink: 0; margin-left: 12px; }
  .row.company { margin-bottom: 2px; }
  .row.company .left { font-weight: 700; font-size: 10.5pt; color: #111; }
  .row.role { margin-top: var(--role-gap); margin-bottom: 2px; }
  .row.role .left { font-style: italic; font-size: 10pt; color: #333; font-weight: 500; }
  .row.project { margin-top: var(--role-gap); }
  .row.project .name-tag { font-weight: 700; font-size: 10.5pt; }
  .row.project .tech { font-size: 8.8pt; color: #555; font-style: italic; margin-left: 4px; }
  .row.project .right { font-size: 8.6pt; }
  .row.project .right a.plink { margin-left: 7px; font-size: 7.9pt; }
  .row.edu .left .inst { font-weight: 700; font-size: 10.5pt; }
  .row.edu .left .deg { font-size: 10pt; color: #444; font-style: italic; }

  /* ── Bullets ── */
  ul { padding-left: 14px; margin-top: 2px; }
  ul li { margin-bottom: var(--li-gap); font-size: var(--li); line-height: var(--li-lh); color: #1a1a1a; page-break-inside: avoid; }
  ul li::marker { color: #1e3a5f; font-size: 9pt; }

  /* ── Plain lines (certifications, free text) ── */
  .line { font-size: var(--li); line-height: 1.45; }
</style>
</head>
<body class="{{DENSITY}}">
<div class="page">
  {{RESUME_CONTENT}}
</div>
</body>
</html>
